name: Run DB and Pipeline

on:
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_news_aggregator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for i in {1..60}; do
            pg_isready -h localhost -p 5432 -U postgres && break || sleep 1
          done

      - name: Create pgvector extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 5432 -U postgres -d ai_news_aggregator -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies (from pyproject)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python - <<'PY'
import tomllib
with open('pyproject.toml','rb') as f:
    data = tomllib.load(f)
reqs = data.get('project', {}).get('dependencies', [])
with open('requirements.txt','w') as out:
    out.write('\n'.join(reqs))
print('Wrote requirements.txt')
PY
          python -m pip install -r requirements.txt

      - name: Run pipeline
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_news_aggregator
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python main.py 24 10
